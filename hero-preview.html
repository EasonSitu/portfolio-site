<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zhicheng Situ | Hero Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #050506;
      color: #faf9f7;
      font-family: "Inter", system-ui, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    .hero-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 2rem;
      position: relative;
    }

    /* Navigation */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.25rem 2rem;
      background: rgba(5, 5, 6, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(128, 90, 213, 0.15);
    }

    .nav-inner {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-family: "JetBrains Mono", monospace;
      font-size: 1.2rem;
      font-weight: 600;
      color: #faf9f7;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
    }

    .nav-links a {
      font-size: 0.85rem;
      font-weight: 500;
      color: #a0aec0;
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav-links a:hover { color: #faf9f7; }

    /* Hero Content */
    .hero-content {
      flex: 1;
      max-width: 560px;
      padding-left: 8%;
      z-index: 10;
    }

    .eyebrow {
      display: inline-block;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: #b794f4;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      padding: 0.4rem 0.8rem;
      border: 1px solid rgba(128, 90, 213, 0.15);
      border-radius: 4px;
      background: rgba(128, 90, 213, 0.08);
    }

    .hero-heading {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 1.5rem;
      letter-spacing: -0.02em;
    }

    .hero-subtext {
      font-size: 1.1rem;
      color: #a0aec0;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    .hero-actions {
      display: flex;
      gap: 1rem;
    }

    .primary-btn {
      display: inline-flex;
      align-items: center;
      padding: 0.875rem 2rem;
      background: #805ad5;
      color: #faf9f7;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .primary-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(128, 90, 213, 0.4);
    }

    .secondary-btn {
      display: inline-flex;
      align-items: center;
      padding: 0.875rem 2rem;
      background: transparent;
      color: #faf9f7;
      font-weight: 500;
      font-size: 0.95rem;
      border: 1px solid rgba(128, 90, 213, 0.15);
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .secondary-btn:hover {
      border-color: #b794f4;
      background: rgba(128, 90, 213, 0.1);
      transform: translateY(-2px);
    }

    /* Structure Container */
    .structure-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      min-height: 600px;
    }

    .structure-wrapper {
      position: relative;
      width: 400px;
      height: 550px;
    }

    /* Golden Pillar */
    .golden-pillar {
      position: absolute;
      left: 50%;
      top: 10%;
      bottom: 15%;
      width: 3px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, transparent, #d4af37 20%, #f0d060 50%, #d4af37 80%, transparent);
      z-index: 5;
    }

    .pillar-glow {
      position: absolute;
      inset: -10px;
      background: rgba(212, 175, 55, 0.4);
      filter: blur(15px);
      animation: pillarBreath 3s ease-in-out infinite;
    }

    @keyframes pillarBreath {
      0%, 100% { opacity: 0.4; transform: scaleX(1); }
      50% { opacity: 0.7; transform: scaleX(1.3); }
    }

    /* Floating Panels */
    .panels-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 5% 0;
      z-index: 10;
    }

    .floating-panel {
      position: relative;
      width: 75%;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      background: rgba(10, 10, 15, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(128, 90, 213, 0.15);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      animation: panelFloat 6s ease-in-out infinite;
      transform-origin: center center;
    }

    .floating-panel:nth-child(1) { animation-delay: 0s; }
    .floating-panel:nth-child(2) { animation-delay: 0.8s; }
    .floating-panel:nth-child(3) { animation-delay: 1.6s; }
    .floating-panel:nth-child(4) { animation-delay: 2.4s; }
    .floating-panel:nth-child(5) { animation-delay: 3.2s; }

    .floating-panel:hover {
      border-color: #b794f4;
      transform: translateX(5px);
    }

    .panel-edge {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: linear-gradient(180deg, #805ad5, #b794f4);
      border-radius: 3px 0 0 3px;
      opacity: 0.3;
      transition: opacity 0.3s;
    }

    .panel-content {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .panel-number {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      color: #b794f4;
      opacity: 0.6;
    }

    .panel-label {
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .panel-shine {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(183, 148, 244, 0.05), transparent);
      animation: panelShine 4s ease-in-out infinite;
    }

    @keyframes panelFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-3px) rotate(0.5deg); }
      75% { transform: translateY(3px) rotate(-0.5deg); }
    }

    @keyframes panelShine {
      0% { left: -100%; }
      50%, 100% { left: 200%; }
    }

    /* Orb Base */
    .orb-base {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 20px;
      z-index: 8;
    }

    .base-ring {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(212, 175, 55, 0.1), transparent);
    }

    /* Energy Orb */
    .orb-container {
      position: absolute;
      bottom: 8%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
    }

    .energy-orb {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f0d060, #d4af37);
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
      animation: orbPulse 2s ease-in-out infinite;
    }

    .energy-orb:hover { transform: scale(1.1); }
    .energy-orb:active { transform: scale(0.95); }

    .orb-inner {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, rgba(255, 255, 255, 0.9), rgba(240, 208, 96, 0.6));
    }

    .orb-pulse {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.4);
      animation: orbGlow 2s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes orbPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes orbGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.15); }
    }

    /* Ground Paths */
    .ground-paths {
      position: absolute;
      bottom: 6%;
      left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 30px;
      z-index: 6;
    }

    .ground-path {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      height: 2px;
      background: linear-gradient(90deg, transparent, #d4af37, transparent);
      opacity: 0;
      transform-origin: center;
      transform: translateX(-50%) scaleX(0);
    }

    .ground-path:nth-child(1) { width: 100%; bottom: 0; }
    .ground-path:nth-child(2) { width: 80%; bottom: 8px; }
    .ground-path:nth-child(3) { width: 60%; bottom: 16px; }

    /* Particle Container */
    .particle-container {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      z-index: 20;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #f0d060;
      border-radius: 50%;
      box-shadow: 0 0 6px rgba(212, 175, 55, 0.4);
    }

    .ripple {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 50px;
      border: 2px solid rgba(212, 175, 55, 0.5);
      border-radius: 50%;
      pointer-events: none;
    }

    /* Seal Projection */
    .seal-projection {
      position: absolute;
      bottom: 2%;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 120px;
      z-index: 18;
      pointer-events: none;
      opacity: 0;
    }

    .seal-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
    }

    /* Animation Label */
    .anim-label {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.65rem;
      color: #f0d060;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0;
      white-space: nowrap;
      transition: opacity 0.3s;
    }

    .anim-label.visible { opacity: 0.7; }

    /* Responsive */
    @media (max-width: 1024px) {
      .hero-section {
        flex-direction: column;
        justify-content: center;
        padding-top: 6rem;
      }
      .hero-content {
        padding-left: 0;
        text-align: center;
        max-width: 100%;
        margin-bottom: 3rem;
      }
      .hero-actions { justify-content: center; }
    }

    @media (max-width: 768px) {
      .structure-wrapper {
        width: 300px;
        height: 420px;
        transform: scale(0.85);
      }
      .panel-label { font-size: 0.75rem; }
    }

    @media (max-width: 480px) {
      .hero-actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="nav">
    <div class="nav-inner">
      <a href="#" class="nav-logo">ZS</a>
      <div class="nav-links">
        <a href="#about">About</a>
        <a href="#work">Work</a>
        <a href="#contact">Contact</a>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-content">
      <span class="eyebrow">AI & DIGITAL SOLUTION DELIVERY</span>
      <h1 class="hero-heading">I turn complexity<br>into clarity.</h1>
      <p class="hero-subtext">Connecting business needs, technical teams, and real-world delivery.</p>
      <div class="hero-actions">
        <a href="#work" class="primary-btn">View My Work</a>
        <a href="#contact" class="secondary-btn">Download CV</a>
      </div>
    </div>

    <div class="structure-container">
      <div class="structure-wrapper">
        <!-- Golden Pillar -->
        <div class="golden-pillar">
          <div class="pillar-glow"></div>
        </div>

        <!-- Floating Panels -->
        <div class="panels-container">
          <div class="floating-panel" data-index="0">
            <div class="panel-edge"></div>
            <div class="panel-content">
              <span class="panel-number">01</span>
              <span class="panel-label">Business Context</span>
            </div>
            <div class="panel-shine"></div>
          </div>
          <div class="floating-panel" data-index="1">
            <div class="panel-edge"></div>
            <div class="panel-content">
              <span class="panel-number">02</span>
              <span class="panel-label">Requirements</span>
            </div>
            <div class="panel-shine"></div>
          </div>
          <div class="floating-panel" data-index="2">
            <div class="panel-edge"></div>
            <div class="panel-content">
              <span class="panel-number">03</span>
              <span class="panel-label">Coordination</span>
            </div>
            <div class="panel-shine"></div>
          </div>
          <div class="floating-panel" data-index="3">
            <div class="panel-edge"></div>
            <div class="panel-content">
              <span class="panel-number">04</span>
              <span class="panel-label">Testing</span>
            </div>
            <div class="panel-shine"></div>
          </div>
          <div class="floating-panel" data-index="4">
            <div class="panel-edge"></div>
            <div class="panel-content">
              <span class="panel-number">05</span>
              <span class="panel-label">Delivery</span>
            </div>
            <div class="panel-shine"></div>
          </div>
        </div>

        <!-- Ground Paths -->
        <div class="ground-paths">
          <div class="ground-path"></div>
          <div class="ground-path"></div>
          <div class="ground-path"></div>
        </div>

        <!-- Orb Base -->
        <div class="orb-base">
          <div class="base-ring"></div>
        </div>

        <!-- Energy Orb -->
        <div class="orb-container">
          <div class="energy-orb" id="energyOrb" role="button" aria-label="Trigger animation" tabindex="0">
            <div class="orb-inner"></div>
            <div class="orb-pulse"></div>
          </div>
        </div>

        <!-- Particle Container -->
        <div class="particle-container" id="particleContainer"></div>

        <!-- Seal Projection -->
        <div class="seal-projection" id="sealProjection">
          <svg viewBox="0 0 120 120" class="seal-svg">
            <circle cx="60" cy="60" r="55" fill="none" stroke="rgba(212, 175, 55, 0.6)" stroke-width="2"/>
            <path d="M60 15 L60 105 M15 60 L105 60" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.5"/>
            <circle cx="60" cy="60" r="30" fill="none" stroke="rgba(212, 175, 55, 0.5)" stroke-width="1"/>
            <text x="60" y="65" text-anchor="middle" fill="rgba(212, 175, 55, 0.8)" font-size="14" font-family="monospace">DELIVERED</text>
          </svg>
        </div>

        <!-- Animation Label -->
        <div class="anim-label" id="animLabel"></div>
      </div>
    </div>
  </section>

  <script>
    // GSAP-like animation helper
    const animate = (element, props, duration = 1000, easing = 'ease-out') => {
      return new Promise(resolve => {
        if (!element) { resolve(); return; }
        const start = performance.now();
        const startValues = {};
        
        for (const [key, value] of Object.entries(props)) {
          if (key === 'opacity') startValues[key] = parseFloat(getComputedStyle(element).opacity);
          else if (key === 'scale' || key === 'scaleX' || key === 'scaleY') startValues[key] = 1;
          else if (key === 'x' || key === 'y') startValues[key] = 0;
          else if (key === 'rotate') startValues[key] = 0;
          else startValues[key] = parseFloat(getComputedStyle(element)[key]) || 0;
        }

        const step = (timestamp) => {
          const elapsed = timestamp - start;
          const progress = Math.min(elapsed / duration, 1);
          const eased = easing === 'ease-out' ? 1 - Math.pow(1 - progress, 3) : progress;

          for (const [key, endValue] of Object.entries(props)) {
            const startValue = startValues[key];
            const current = startValue + (endValue - startValue) * eased;
            
            if (key === 'opacity') element.style.opacity = current;
            else if (key === 'scale') element.style.transform = `scale(${current})`;
            else if (key === 'scaleX') element.style.transform = `scaleX(${current})`;
            else if (key === 'scaleY') element.style.transform = `scaleY(${current})`;
            else if (key === 'x') element.style.transform = `translateX(${current}px)`;
            else if (key === 'y') element.style.transform = `translateY(${current}px)`;
            else if (key === 'rotate') element.style.transform = `rotate(${current}deg)`;
            else if (key === 'boxShadow') element.style.boxShadow = endValue;
          }

          if (progress < 1) requestAnimationFrame(step);
          else resolve();
        };

        requestAnimationFrame(step);
      });
    };

    // Elements
    const orb = document.getElementById('energyOrb');
    const particleContainer = document.getElementById('particleContainer');
    const seal = document.getElementById('sealProjection');
    const animLabel = document.getElementById('animLabel');
    const panels = document.querySelectorAll('.floating-panel');
    const groundPaths = document.querySelectorAll('.ground-path');
    const pillar = document.querySelector('.golden-pillar');

    let isAnimating = false;

    // Panel interaction
    panels.forEach((panel, index) => {
      panel.addEventListener('mouseenter', () => {
        panel.querySelector('.panel-edge').style.opacity = '1';
      });
      panel.addEventListener('mouseleave', () => {
        panel.querySelector('.panel-edge').style.opacity = '0.3';
      });
      panel.addEventListener('click', () => {
        panel.style.borderColor = 'rgba(212, 175, 55, 0.6)';
        panel.style.boxShadow = '0 0 20px rgba(212, 175, 55, 0.2)';
        setTimeout(() => {
          panel.style.borderColor = 'rgba(128, 90, 213, 0.15)';
          panel.style.boxShadow = 'none';
        }, 1500);
      });
    });

    // Mystery box animations
    orb.addEventListener('click', async () => {
      if (isAnimating) return;
      isAnimating = true;

      // Pre-charge
      await animate(orb, { scale: 1.3 }, 300);
      await animate(orb, { scale: 0.9 }, 150);

      const rand = Math.random();
      let animType;

      if (rand < 0.35) animType = 'goldenDownstream';
      else if (rand < 0.6) animType = 'verticalBreakthrough';
      else if (rand < 0.8) animType = 'impactRipple';
      else if (rand < 0.95) animType = 'particleRise';
      else animType = 'sealProjection';

      // Show label
      const label = animType.replace(/([A-Z])/g, ' $1').trim();
      animLabel.textContent = label;
      animLabel.classList.add('visible');

      switch (animType) {
        case 'goldenDownstream':
          await goldenDownstream();
          break;
        case 'verticalBreakthrough':
          await verticalBreakthrough();
          break;
        case 'impactRipple':
          await impactRipple();
          break;
        case 'particleRise':
          await particleRise();
          break;
        case 'sealProjection':
          await sealProjection();
          break;
      }

      setTimeout(() => {
        animLabel.classList.remove('visible');
        isAnimating = false;
      }, 2000);
    });

    async function goldenDownstream() {
      orb.style.boxShadow = '0 0 60px 20px rgba(212, 175, 55, 0.8)';
      
      for (let i = 0; i < groundPaths.length; i++) {
        await new Promise(r => setTimeout(r, 150));
        groundPaths[i].style.opacity = '1';
        groundPaths[i].style.transform = 'translateX(-50%) scaleX(1)';
        groundPaths[i].style.transition = 'all 0.3s ease-out';
      }

      await new Promise(r => setTimeout(r, 800));
      
      groundPaths.forEach(p => {
        p.style.opacity = '0';
        p.style.transition = 'opacity 0.8s';
      });
      
      orb.style.boxShadow = '0 0 30px 8px rgba(212, 175, 55, 0.4)';
      orb.style.transition = 'box-shadow 0.5s';
    }

    async function verticalBreakthrough() {
      orb.style.boxShadow = '0 0 80px 30px rgba(212, 175, 55, 0.9)';
      
      await new Promise(r => setTimeout(r, 300));
      pillar.style.filter = 'brightness(1.5)';
      pillar.style.transition = 'filter 0.5s';
      
      for (let i = 0; i < panels.length; i++) {
        await new Promise(r => setTimeout(r, 100));
        panels[i].style.borderColor = 'rgba(212, 175, 55, 0.6)';
        panels[i].style.boxShadow = '0 0 20px rgba(212, 175, 55, 0.3)';
        panels[i].style.transition = 'all 0.15s';
      }

      await new Promise(r => setTimeout(r, 500));
      
      panels.forEach(p => {
        p.style.borderColor = 'rgba(128, 90, 213, 0.15)';
        p.style.boxShadow = 'none';
        p.style.transition = 'all 0.8s';
      });
      
      pillar.style.filter = 'brightness(1)';
      orb.style.boxShadow = '0 0 30px 8px rgba(212, 175, 55, 0.4)';
    }

    async function impactRipple() {
      orb.style.boxShadow = '0 0 80px 30px rgba(212, 175, 55, 0.9)';
      
      for (let i = 0; i < 3; i++) {
        const ripple = document.createElement('div');
        ripple.className = 'ripple';
        particleContainer.appendChild(ripple);
        
        ripple.style.opacity = '0.8';
        ripple.style.transform = 'translateX(-50%) scale(0.1)';
        ripple.style.transition = `all ${1.2 + i * 0.3}s ease-out`;
        
        await new Promise(r => setTimeout(r, 50));
        ripple.style.transform = `translateX(-50%) scale(${2 + i * 0.5})`;
        ripple.style.opacity = '0';
        
        setTimeout(() => ripple.remove(), 2000);
      }

      await new Promise(r => setTimeout(r, 1000));
      orb.style.boxShadow = '0 0 30px 8px rgba(212, 175, 55, 0.4)';
    }

    async function particleRise() {
      orb.style.boxShadow = '0 0 60px 20px rgba(212, 175, 55, 0.8)';
      
      for (let i = 0; i < 12; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particleContainer.appendChild(particle);
        
        const angle = (Math.PI * 2 * i) / 12;
        const distance = 60 + Math.random() * 40;
        const duration = 1500 + Math.random() * 500;
        
        particle.style.opacity = '1';
        particle.style.transform = 'translate(0, 0) scale(1)';
        particle.style.transition = `all ${duration}ms ease-out`;
        
        await new Promise(r => setTimeout(r, 100));
        particle.style.transform = `translate(${Math.cos(angle) * distance}px, ${-150 - Math.random() * 100}px) scale(0)`;
        particle.style.opacity = '0';
        
        setTimeout(() => particle.remove(), duration + 100);
      }

      await new Promise(r => setTimeout(r, 1500));
      orb.style.boxShadow = '0 0 30px 8px rgba(212, 175, 55, 0.4)';
    }

    async function sealProjection() {
      orb.style.boxShadow = '0 0 80px 30px rgba(212, 175, 55, 0.9)';
      
      seal.style.opacity = '0';
      seal.style.transform = 'translateX(-50%) scale(0.5) rotate(-30deg)';
      seal.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
      
      await new Promise(r => setTimeout(r, 50));
      seal.style.opacity = '0.9';
      seal.style.transform = 'translateX(-50%) scale(1) rotate(0deg)';
      
      await new Promise(r => setTimeout(r, 1400));
      seal.style.opacity = '0';
      seal.style.transform = 'translateX(-50%) scale(0.8)';
      seal.style.transition = 'all 1s ease-in';
      
      orb.style.boxShadow = '0 0 30px 8px rgba(212, 175, 55, 0.4)';
    }

    // Keyboard support
    orb.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        orb.click();
      }
    });
  </script>
</body>
</html>
