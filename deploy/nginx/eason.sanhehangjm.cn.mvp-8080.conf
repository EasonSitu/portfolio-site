# MVP only: Nginx serves the static export on port 8080 while
# Caddy keeps port 80 and Xray keeps port 443.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name eason.sanhehangjm.cn _;

    root /var/www/eason.sanhehangjm.cn/current;
    index index.html;

    include /etc/nginx/snippets/portfolio-security-headers.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~* ^/_next/static/ {
        try_files $uri =404;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|glb|pdf|json|wasm)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
}
