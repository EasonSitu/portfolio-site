# Bootstrap configuration used before the Let's Encrypt certificate exists.
# Install as /etc/nginx/sites-available/eason.sanhehangjm.cn.conf.
server {
    listen 80;
    listen [::]:80;
    server_name eason.sanhehangjm.cn;

    root /var/www/eason.sanhehangjm.cn/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    include /etc/nginx/snippets/portfolio-security-headers.conf;

    location ~* ^/_next/static/ {
        try_files $uri =404;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|glb|pdf|json|wasm)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
}
