# Final HTTPS configuration after certbot has issued the certificate.
# Install as /etc/nginx/sites-available/eason.sanhehangjm.cn.conf.

server {
    listen 80;
    listen [::]:80;
    server_name eason.sanhehangjm.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name eason.sanhehangjm.cn;

    root /var/www/eason.sanhehangjm.cn/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/eason.sanhehangjm.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eason.sanhehangjm.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    include /etc/nginx/snippets/portfolio-security-headers.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location ~* ^/_next/static/ {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|glb|pdf|json|wasm)$ {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
        include /etc/nginx/snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }
}
